name: Update Battery Data

on:
  schedule:
    # Every Monday at 6am UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas yfinance python-dateutil openpyxl

      - name: Run pipeline
        run: python scripts/fetch_battery_data.py

      - name: Commit updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/materials.json data/kwh_index.json
          git diff --cached --quiet || git commit -m "Auto-update battery data $(date -u '+%Y-%m-%d')"
          git push
